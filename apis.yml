name: Slik
description: >-
  Slik is a Latin American employee experience (PX) platform that helps
  organizations measure, analyze, and activate employee engagement in real
  time. Its Engagement module runs collaborator-journey surveys with real-time
  reporting, AI-prioritized improvement opportunities, people analytics and
  prediction, and leader action plans across the selection, onboarding, climate,
  and wellbeing touchpoints; its Performance module tracks cascading OKRs and
  continuous feedback outside annual review cycles. Slik distributes surveys and
  reaches employees through messaging channels including Slack, Google, Microsoft
  Teams, Workplace, and WhatsApp. Founded in Buenos Aires, Argentina and backed by
  500 Global/500 Latam, AVP Ventures, and Vulcano Fund, the platform serves large
  enterprises such as Burger King, AXA, DHL, Starbucks, and Dole. Slik does not
  publish a public developer API, developer portal, or API documentation; this
  profile captures the company identity and probed domain-security posture.
